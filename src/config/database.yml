default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ourtime_db_development
  host: ourtime_db
  username: postgres
  password: password
  port: 5432

test:
  <<: *default
  database: ourtime_test
  host: ourtime_db
  username: postgres
  password: password
  port: 5432

production:
  primary:
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    url: <%= ENV["DATABASE_URL"] %>
